<!doctype html>
<!--
  JARVIS HUD — Amrit's personal dashboard
  Open this file directly in any modern browser (including a Fire TV browser). No install or network required.
  To add the morning brief, click the brief text and paste/type over it; it saves in this browser automatically.
  Switch themes with the top-right button or press T. Use the speaker button to read the brief aloud.
-->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark"><title>JARVIS // Amrit</title>
<style>
:root{--bg:#060d1c;--bg2:#0a1630;--panel:rgba(10,24,47,.72);--line:rgba(79,216,255,.22);--accent:#4fd8ff;--accent2:#a0efff;--text:#e8f7ff;--muted:#7f9db2;--hot:#ff5578;--shadow:0 0 30px rgba(42,182,255,.08);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:Inter,Segoe UI,Arial,sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(ellipse at 50% -20%,#142b4c 0%,transparent 54%),linear-gradient(135deg,var(--bg),var(--bg2));color:var(--text);font-family:var(--sans);overflow-x:hidden;position:relative}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(rgba(79,216,255,.075) 1px,transparent 1px),linear-gradient(90deg,rgba(79,216,255,.075) 1px,transparent 1px);background-size:52px 52px;mask-image:linear-gradient(to bottom,black,transparent 90%)}
.shell{width:min(1500px,94vw);min-height:100%;margin:auto;padding:clamp(22px,4vw,58px) 0;display:flex;flex-direction:column;position:relative}.topline{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 0 18px}.brand{display:flex;gap:13px;align-items:center;font:600 12px var(--mono);letter-spacing:.22em;color:var(--accent)}.mark{width:27px;height:27px;border:1px solid var(--accent);display:grid;place-items:center;transform:rotate(45deg);box-shadow:0 0 16px #4fd8ff33}.mark span{transform:rotate(-45deg);font-size:14px}.edition{color:var(--muted);font:10px var(--mono);letter-spacing:.18em;margin-left:14px}.theme-btn{background:transparent;border:1px solid var(--line);color:var(--accent2);padding:11px 15px;font:11px var(--mono);letter-spacing:.1em;cursor:pointer;transition:.2s}.theme-btn:hover,.speak:hover{background:var(--accent);color:#06111f;box-shadow:0 0 24px color-mix(in srgb,var(--accent) 40%,transparent)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:clamp(35px,6vh,75px) 0}.hero{text-align:center;margin:0 0 clamp(34px,6vh,66px)}.eyebrow{font:11px var(--mono);letter-spacing:.32em;color:var(--accent);margin-bottom:13px}.clock{font:clamp(82px,15vw,186px)/.92 var(--mono);letter-spacing:-.075em;font-variant-numeric:tabular-nums;text-shadow:0 0 42px #4fd8ff20}.clock .colon{color:var(--accent);animation:pulse 1s steps(2,start) infinite}@keyframes pulse{to{opacity:.3}}.date{margin-top:20px;color:var(--muted);font:clamp(12px,1.5vw,16px) var(--mono);letter-spacing:.2em;text-transform:uppercase}.grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:20px}.panel{position:relative;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);padding:clamp(22px,3vw,36px);min-height:250px;backdrop-filter:blur(8px)}.panel:before,.panel:after{content:"";position:absolute;width:20px;height:20px;pointer-events:none}.panel:before{top:-1px;left:-1px;border-top:2px solid var(--accent);border-left:2px solid var(--accent)}.panel:after{right:-1px;bottom:-1px;border-bottom:2px solid var(--accent);border-right:2px solid var(--accent)}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.panel-title{font:600 12px var(--mono);letter-spacing:.19em;color:var(--accent)}.index{font:10px var(--mono);color:var(--muted)}.reminders{list-style:none;padding:0;margin:0}.reminders li{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid rgba(127,157,178,.13);font-size:15px;color:#c9dce8}.reminders li:last-child{border:0}.dot{width:7px;height:7px;border:1px solid var(--accent);border-radius:50%;box-shadow:0 0 8px #4fd8ff60;flex:none}.empty{color:var(--muted);font:12px var(--mono);line-height:1.8}.briefbox{min-height:140px;outline:none;color:#d8e9f4;font-size:clamp(15px,1.5vw,18px);line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}.briefbox:empty:before{content:attr(data-placeholder);color:#68839a}.briefbox:focus{box-shadow:inset 0 0 0 1px var(--line)}.brief-actions{display:flex;justify-content:flex-end;margin-top:18px}.speak{border:1px solid var(--accent);color:var(--accent);background:transparent;padding:12px 19px;font:600 11px var(--mono);letter-spacing:.16em;cursor:pointer;transition:.2s}.speak svg{width:15px;height:15px;vertical-align:middle;margin-right:8px;fill:currentColor}.footer{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font:10px var(--mono);letter-spacing:.12em;border-top:1px solid var(--line);padding-top:16px}.status{display:flex;align-items:center;gap:8px}.live{width:6px;height:6px;background:#70e8b1;border-radius:50%;box-shadow:0 0 10px #70e8b1}
/* Tactical Stealth */
body.stealth{--bg:#0a0a0b;--bg2:#111113;--panel:rgba(20,19,17,.9);--line:rgba(255,176,0,.28);--accent:#ffb000;--accent2:#ffd36b;--text:#f5f0e4;--muted:#988d78;--shadow:0 0 24px rgba(255,176,0,.055);background:radial-gradient(ellipse at 50% -24%,#38290f 0%,transparent 53%),linear-gradient(135deg,#090909,#11100e)}body.stealth:before{opacity:.11;background-image:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.12) 3px,transparent 4px);background-size:100% 5px;mask-image:none}.stealth .panel{clip-path:polygon(0 0,calc(100% - 13px) 0,100% 13px,100% 100%,13px 100%,0 calc(100% - 13px))}.stealth .panel:before{border-color:var(--accent)}.stealth .mark{border-color:var(--accent);box-shadow:0 0 14px #ffb00033}.stealth .clock{text-shadow:0 0 32px #ffb00022}.stealth .dot{border-radius:0;border-color:var(--accent);transform:rotate(45deg);box-shadow:none}.stealth .live{background:var(--accent);box-shadow:0 0 9px var(--accent)}.stealth .speak:hover{background:var(--accent);color:#111}
@media(max-width:760px){.shell{width:90vw}.edition{display:none}.grid{grid-template-columns:1fr}.panel{min-height:unset}.hero{margin-bottom:35px}.clock{font-size:clamp(74px,19vw,140px)}main{padding:38px 0}.footer{font-size:9px}}
@media(max-width:430px){.brand{font-size:10px;letter-spacing:.15em}.theme-btn{padding:9px;font-size:9px}.panel{padding:21px}.footer{gap:12px;flex-wrap:wrap}}
</style></head>
<body><div class="shell"><header class="topline"><div class="brand"><div class="mark"><span>✦</span></div><span>JARVIS <span style="opacity:.55">/ AMRIT</span></span><span class="edition">PERSONAL INTERFACE</span></div><button class="theme-btn" id="theme" aria-label="Switch visual theme">◈ &nbsp;TACTICAL MODE</button></header>
<main><section class="hero"><div class="eyebrow">LOCAL TIME&nbsp; // &nbsp;INDIANAPOLIS</div><div class="clock" id="clock">--:--<span class="colon">:</span>--</div><div class="date" id="date">Loading date</div></section>
<section class="grid"><article class="panel"><div class="panel-head"><div class="panel-title">REMINDERS</div><div class="index">01 / TODAY</div></div><ul class="reminders" id="reminders"><li><span class="dot"></span><span class="empty">No reminders queued.<br>You're clear for now.</span></li></ul></article>
<article class="panel"><div class="panel-head"><div class="panel-title">MORNING TRADING BRIEF</div><div class="index">02 / BRIEFING</div></div><div id="brief" class="briefbox" contenteditable="true" role="textbox" aria-label="Morning trading brief" aria-multiline="true" data-placeholder="Paste or type your morning brief here…"></div><div class="brief-actions"><button class="speak" id="speak"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>READ BRIEF</button></div></article></section></main>
<footer class="footer"><span class="status"><i class="live"></i> SYSTEM ONLINE</span><span>PRESS T TO CHANGE THEME</span><span>HUD // 01</span></footer></div>
<script>
(()=>{const $=id=>document.getElementById(id);function tick(){const d=new Date();$('clock').innerHTML=new Intl.DateTimeFormat('en-US',{hour:'2-digit',minute:'2-digit',hour12:false}).format(d).replace(':','<span class="colon">:</span>')+'<span class="colon">:</span>'+String(d.getSeconds()).padStart(2,'0');$('date').textContent=new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(d)}tick();setInterval(tick,1000);
const brief=$('brief');try{brief.innerText=localStorage.getItem('jarvisBrief')||''}catch(e){}function label(){$('theme').innerHTML=document.body.classList.contains('stealth')?'◈ &nbsp;ICE NAVY':'◈ &nbsp;TACTICAL MODE'}label();brief.addEventListener('input',()=>{try{localStorage.setItem('jarvisBrief',brief.innerText)}catch(e){}});
// Trading schedule uses Indianapolis wall time (DST-aware). Manual theme choice lasts until the next scheduled boundary.
let manualOverride=false,lastScheduled=null;function scheduledTheme(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Indiana/Indianapolis',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const v=Object.fromEntries(parts.map(p=>[p.type,p.value]));const mins=Number(v.hour)*60+Number(v.minute);return ['Mon','Tue','Wed','Thu','Fri'].includes(v.weekday)&&mins>=565&&mins<690}
function setTheme(stealth){document.body.classList.toggle('stealth',stealth);label()}function scheduleCheck(){const target=scheduledTheme();if(lastScheduled===null||target!==lastScheduled){lastScheduled=target;manualOverride=false;setTheme(target)}else if(!manualOverride)setTheme(target)}scheduleCheck();setInterval(scheduleCheck,15000);function toggle(){manualOverride=true;setTheme(!document.body.classList.contains('stealth'))}$('theme').addEventListener('click',toggle);document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='t'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&!document.activeElement.isContentEditable)toggle()});$('speak').addEventListener('click',()=>{const text=brief.innerText.trim();if(!text)return;if(!('speechSynthesis'in window)){alert('Speech synthesis is not available in this browser.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.96;u.pitch=1;speechSynthesis.speak(u)});
})();
</script></body></html>
